<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ochazuke · Interactions as data</title>
<style>
:root{color-scheme:dark;--paper:#efeade;--muted:#9aaca5;--mint:#b7f4c2;--gold:#efc57b;--coral:#f49a85;--bg:#101b19;--rule:#34433d}
*{box-sizing:border-box}body{margin:0;background:#080d0c;color:var(--paper);overflow:hidden;font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center}.stage{width:1920px;height:1080px;position:relative;overflow:hidden;flex-shrink:0;background:var(--bg);transform-origin:center} .stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 95% 0%,#203b2a77,transparent 60%);pointer-events:none}
header{position:absolute;left:100px;right:100px;top:67px;display:flex;justify-content:space-between;align-items:center;font:18px "SFMono-Regular",Consolas,monospace;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}.brand{color:var(--mint)}.edition{font-size:15px;letter-spacing:2px}main{position:absolute;inset:139px 100px 133px} .chapter{display:flex;align-items:center;gap:22px;font:17px "SFMono-Regular",Consolas,monospace;color:var(--mint);letter-spacing:2px}.chapter:after{content:"";height:1px;background:var(--rule);flex:1}h1{font-family:Georgia,"Times New Roman",serif;font-size:72px;font-weight:400;letter-spacing:-2px;margin:23px 0 35px;line-height:1.08}.columns{display:grid;grid-template-columns:650px 1fr;gap:56px;height:562px}.conversation{padding-top:5px}.label{font:15px "SFMono-Regular",Consolas,monospace;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}.question{font-size:26px;line-height:1.44;margin:17px 0 30px;max-width:635px;color:#c9cec4;min-height:113px}.question:before{content:"❯ ";color:var(--coral)}.quote{font-family:Georgia,"Times New Roman",serif;font-size:40px;line-height:1.28;margin:18px 0;letter-spacing:-.6px;min-height:210px}.quote mark{background:none;color:var(--mint);position:relative;text-decoration:underline;text-decoration-color:#b7f4c25c;text-decoration-thickness:3px;text-underline-offset:7px}.beat-counter{display:flex;gap:10px;margin-top:24px}.beat-counter span{width:35px;height:3px;background:var(--rule)}.beat-counter span.active{background:var(--mint)}.editor{border:1px solid #43544b;border-radius:14px;overflow:hidden;background:#0b1412;box-shadow:0 25px 80px #0003;align-self:start}.editor-bar{height:57px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:15px "SFMono-Regular",Consolas,monospace;color:var(--muted)}.dots{display:flex;gap:8px}.dots i{width:8px;height:8px;background:#58675f;border-radius:50%}.dots i:first-child{background:var(--mint)}.code{padding:24px 0 26px;counter-reset:line;font:23px/1.65 "SFMono-Regular",Menlo,Consolas,monospace;white-space:pre}.line{padding:0 25px 0 64px;position:relative;min-height:38px;transition:color .4s;color:#a8b8b0}.line:before{counter-increment:line;content:counter(line);position:absolute;left:20px;top:0;color:#596b61;font-size:15px;line-height:38px}.line:after{content:"";position:absolute;inset:0;background:#b7f4c213;border-left:3px solid var(--mint);opacity:0;transition:opacity .55s;pointer-events:none}.line.hot{color:#f4f6e9}.line.hot:after{opacity:1}.line .str{color:var(--gold)}.line .kw{color:#bbd9fa}.line .comment{color:#82958a}.code-note{margin:0 26px 23px;padding-top:18px;border-top:1px solid #293b32;font:16px/1.5 "SFMono-Regular",Consolas,monospace;color:var(--muted)}footer{position:absolute;left:100px;right:100px;bottom:59px;border-top:1px solid var(--rule);padding-top:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:30px}.takeaway{font-size:25px;letter-spacing:-.4px;color:var(--mint);max-width:830px}.source{max-width:810px;text-align:right;font:13px/1.7 "SFMono-Regular",Consolas,monospace;color:var(--muted)}.rail{position:absolute;bottom:0;left:0;right:0;height:5px;background:#25372e}.progress{height:100%;background:var(--mint);transform-origin:left;transform:scaleX(0)}.scene-enter{animation:enter .7s both}.beat-enter{animation:enter .55s both}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#050b09ed;border:1px solid #4a6255;border-radius:10px;padding:10px 13px;z-index:10;font:13px monospace;box-shadow:0 4px 30px #0007}.controls button,.controls select{font:inherit;background:#1d3026;color:#efeade;border:1px solid #526c5a;border-radius:5px;padding:7px 10px;cursor:pointer}.controls input{width:185px;accent-color:var(--mint)}.controls output{width:110px;text-align:center}.controls small{color:#9aaca5;margin:0 6px}.hidden{display:none}.pause-tag{position:absolute;top:66px;left:875px;color:var(--gold);font:14px monospace;letter-spacing:2px}.recording .pause-tag{display:none}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.beat-counter{align-items:center;gap:14px}.beat-counter button{width:48px;height:30px;padding:0;border:0;background:transparent;cursor:pointer;position:relative}.beat-counter button:after{content:"";position:absolute;left:0;right:0;top:13px;height:4px;background:var(--rule)}.beat-counter button.active:after{background:var(--mint)}.beat-counter .beat-label{width:auto;height:auto;background:none;margin-left:12px;color:var(--muted);font:14px "SFMono-Regular",Consolas,monospace;letter-spacing:1px}
</style>
</head>
<body>
<div class="stage" id="stage" aria-label="Seven animated chapters about interactions as data">
<header><span class="brand">ochazuke / design conversations</span><span class="edition">From control flow to inspectable data</span></header>
<span class="pause-tag" id="pauseTag">READY TO RECORD</span>
<main id="main"><div class="chapter" id="chapter"></div><h1 id="title"></h1><div class="columns"><section class="conversation"><div class="label">You / conversation excerpt</div><p class="question" id="question"></p><div class="label">Agent / adapted excerpt</div><blockquote class="quote" id="quote"></blockquote><div class="beat-counter" id="beats" role="group" aria-label="Chapter highlights"><button type="button" data-beat="0" aria-label="Show highlight 1"></button><button type="button" data-beat="1" aria-label="Show highlight 2"></button><button type="button" data-beat="2" aria-label="Show highlight 3"></button><span class="beat-label" id="beatLabel"></span></div></section><section class="editor"><div class="editor-bar"><span id="filename"></span><span class="dots"><i></i><i></i><i></i></span></div><div class="code" id="code"></div><p class="code-note" id="note"></p></section></div></main>
<footer><div class="takeaway" id="takeaway"></div><div class="source" id="source"></div></footer><div class="rail"><div class="progress" id="progress"></div></div>
</div>
<nav class="controls" id="controls" aria-label="Recording controls"><button id="play">Play</button><button id="replay">Replay</button><select id="sceneSelect" aria-label="Choose chapter"></select><input id="seek" type="range" min="0" max="168" step="0.1" value="0" aria-label="Seek timeline"><output id="time">0:00 / 2:48</output><button id="capture">Hide controls</button><button id="fullscreen">Fullscreen</button><small>Space play · R replay · ← → highlight · 1–7 chapter · H controls · F fullscreen</small></nav>
<script>
'use strict';
// Code is transcript-era pseudocode, shortened for video, not executable API examples.
const scenes = [
{title:'A lookup, not a maze.',name:'The dynamic keyboard model',source:'cannot-with-markers.txt:3030–3090',question:'“i always imagined it would be very simple. … it should be almost completely dynamic”',file:'01 / key → binding → request',note:'Transcript pseudocode, condensed. Later chapters remove the grammar hooks.',code:['seq = pending ? pending + " " + key : key','','for (b of effectiveBindings(context)) {','  exact  ||= b.keys == seq','  longer ||= b.keys.startsWith(seq + " ")','}','','if (longer) rememberAndWait(seq)','else if (exact) execute(exact.request)','','list.bindings // reads the same tables'],beats:[{q:'Enabling a noun, rebinding a key, or changing state <mark>alters the next lookup with no code path involved.</mark>',rows:[2,3,4]},{q:'<mark>list.bindings prints the same table the loop reads.</mark>',rows:[2,10]},{q:'Exact or partial match, then <mark>trigger with the instance and state as context.</mark>',rows:[0,7,8]}],take:'Change the data. The next lookup changes.'},
{title:'Every pending condition is a mode.',name:'Replacing conditionals with modes',source:'my-modal-binding-design.txt:3208–3298',question:'“can completely eliminate those conditionals/guards. … how? by using modes.”',file:'02 / modes as tables',note:'Early proposal. The next chapter replaces the proposed overlay with a shadow mode.',code:['modes = {','  normal: {','    q: enter("macro_pending"),','    d: enter("operator_pending")','  },','  macro_pending: {','    alpha: macro.start,','    any: enter("normal")','  }','}','','dispatch(key) = lookup(mode, key)'],beats:[{q:'Every “pending” condition is <mark>a mode with its own keymap.</mark>',rows:[1,2,5,6]},{q:'The guards vanish because <mark>the lookup key includes the mode.</mark>',rows:[5,6,7,11]},{q:'<mark>Every conditional in dispatchKey became a row.</mark>',rows:[2,3,6,7]}],take:'Represent the condition in the lookup key.'},
{title:'One mechanism. No escape hatch.',name:'Shadow mode keeps one mechanism, without hooks',source:'my-modal-binding-design.txt:3302–3396',question:'“it can be a plain mode…if we can override state…”',file:'03 / the shadow + the resolver',note:'A shadow carries the mode recording would otherwise be in. Exact → class → any.',code:['macro_recording.any = (key, state) => {','  macro.append(key)','  next = dispatch(key, state.mode.shadow)','  state.mode.shadow = next.mode','}','','stack(focus).forEach(inst => {','  table = bindings[inst.noun][mode]','  hit = table[key] ?? table[classOf(key)]','                   ?? table.any','  if (hit) return hit(key, state, inst)','})'],beats:[{q:'The resolver stays <mark>lookup(mode, key).</mark>',rows:[2,3,7]},{q:'Every pending condition is a mode with a payload. <mark>There is no second kind of thing.</mark>',rows:[6,7,8,9,10]},{q:'Adding the terminal pane, or command input, <mark>adds tables, not routers.</mark>',rows:[7,8,9]}],take:'New behavior adds rows, not another key router.'},
{title:'Capture the target. Keep the intent.',name:'The target is captured as data',source:'fucking-right.txt:3908–3946',question:'“how does it know it’s not removing a worktree that shouldn’t be removd?”',file:'04 / a request survives the modal',note:'Confirmation preserves the target. Domain rules still belong to the application handler.',code:['// x captures this request','request = {','  noun: "worktree",','  verb: "remove",','  target: "wt-main"','}','','// the confirm modal holds that request','modal.payload.request = request','','// y runs the captured intent','Run(modal.payload.request)'],beats:[{q:'The target is <mark>captured as data at the moment you press the key.</mark>',rows:[1,2,3,4,5]},{q:'It is <mark>carried along explicitly.</mark>',rows:[8]},{q:'Nothing later asks <mark>“what is focused now”.</mark>',rows:[4,11]}],take:'Confirm the original request, not the current selection.'},
{title:'“It is clean because it is just data.”',name:'Define is clean because it is just data',source:'fucking-right.txt:3961–4009',question:'“the define() is beautiful…so clean”',file:'05 / one declaration, shared readers',note:'JS-style design pseudocode from the conversation. Not the current Go API.',code:['define("worktree", {','  verbs: {','    open: app.openWorktree,','    remove: {','      run: app.removeWorktree,','      confirm: "Remove worktree {{id}}?"','    }','  },','  bindings: {','    normal: { o: "open", x: "remove" }','  }','})'],beats:[{q:'<mark>The data shape is the design,</mark> and it reads the same in either language.',rows:[0,1,8]},{q:'The same shape the config file uses, the same shape list.bindings prints, and <mark>the same shape the palette and help read.</mark>',rows:[1,8,9]},{q:'If a future need cannot be expressed as a mode table row, <mark>the answer is a new mode, not a hook.</mark>',rows:[8,9,10]}],take:'Config, help, palette, and bindings read the same shape.'},
{title:'The interaction model is inspectable.',name:'Why inspectable data gives this attempt better odds',source:'cannot-with-markers.txt:5537–5571',question:'“i’m actually excited. do you think it will be successful?”',file:'06 / data you can inspect',note:'Illustrative table derived from the conversation. Historical success claims are not benchmarks.',code:['noun       mode               key   request','───────────────────────────────────────────','editor     normal             i     mode.set','editor     operator_pending   w     motion.apply','terminal   leader_pending     d     detach','','// the same rows can be','print(rows)','diff(before, after)','test(mode, key, nextMode, action)'],beats:[{q:'<mark>The design is data.</mark> Nouns, modes, rows and payloads are things you can print, diff and test as tables.',rows:[0,2,3,4]},{q:'The previous attempts’ key handling was <mark>control flow, which is why it grew switches in the shell.</mark>',rows:[7,8,9]},{q:'A Bubble Tea app framework where <mark>the whole interaction model is inspectable data.</mark>',rows:[2,3,4,7,8,9]}],take:'The caution in the reply: ship a real consumer; keep scope small.'},
{title:'Once it is data, you can build tools.',name:'Binding checker, sandbox, and designer become possible',source:'cannot-with-markers.txt:5596–5651',question:'“the full spectrum … binding utility … will be … possible and … useful”',file:'07 / tables become a graph',note:'Proposed tooling, not a claim that these checks or config-defined CLI verbs are implemented.',code:['graph = modesAndTransitions(rows)','','check.noPathBackToNormal(graph)','check.missingExit(rows)','check.shadowedBindings(stack)','check.prefixAmbiguity(rows)','check.danglingReferences(rows)','check.unreachableModes(graph)','','define("bindings", {','  verbs: { list, check, set, sandbox, export }','})'],beats:[{q:'The whole interaction model <mark>is data now.</mark>',rows:[0,9,10]},{q:'Every mode table is a set of rows, and <mark>every row that calls set.mode or enter is an edge.</mark>',rows:[0,2,3,4,5,6,7]},{q:'The designer is a table editor over rows. And config-defined application verbs could make <mark>any CLI a noun with no Go.</mark>',rows:[9,10,11]}],take:'Inspect the rows. Check the graph. Edit the same data.'}
];
const $=id=>document.getElementById(id); const duration=168, chapterLength=24, beatLength=8;
let time=0, playing=false, last=0, sceneIndex=-1, beatIndex=-1;
function escape(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function syntax(s){if(s.trimStart().startsWith('//'))return '<span class="comment">'+escape(s)+'</span>';return s.split(/("[^"\n]*")/g).map((part,i)=>i%2?'<span class="str">'+escape(part)+'</span>':escape(part).replace(/\b(for|if|else|return|const)\b/g,'<span class="kw">$1</span>')).join('')}
function animate(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function render(force=false){const index=Math.min(6,Math.floor(time/chapterLength));const local=Math.min(23.999,time-index*chapterLength);const beat=Math.min(2,Math.floor(local/beatLength));const s=scenes[index];
if(index!==sceneIndex||force){sceneIndex=index;beatIndex=-1;$('chapter').textContent=String(index+1).padStart(2,'0')+' / 07 · '+s.name;$('title').textContent=s.title;$('question').textContent=s.question;$('filename').textContent=s.file;$('note').textContent=s.note;$('takeaway').textContent=s.take;$('source').textContent='SOURCE / '+s.source+' · excerpt\nTranscript-era design · code condensed for video';$('code').innerHTML=s.code.map((line,i)=>'<div class="line" data-line="'+i+'">'+(syntax(line)||' ')+'</div>').join('');$('sceneSelect').value=index;animate($('main'),'scene-enter')}
if(beat!==beatIndex||force){beatIndex=beat;$('quote').innerHTML=s.beats[beat].q;$('beatLabel').textContent='HIGHLIGHT '+(beat+1)+' OF 3';$('beats').querySelectorAll('button').forEach((el,i)=>{el.classList.toggle('active',i===beat);el.setAttribute('aria-pressed',String(i===beat))});document.querySelectorAll('.line').forEach((el,i)=>el.classList.toggle('hot',s.beats[beat].rows.includes(i)));animate($('quote'),'beat-enter')}
$('progress').style.transform='scaleX('+(time/duration)+')';$('seek').value=time;$('time').textContent=format(time)+' / 2:48';$('play').textContent=playing?'Pause':'Play';$('pauseTag').textContent=time===duration?'END / R TO REPLAY':time===0?'READY TO RECORD':'PAUSED';$('pauseTag').style.visibility=playing?'hidden':'visible';}
function format(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function seek(t){time=Math.max(0,Math.min(duration,t));render()}
function stepHighlight(direction){seek((Math.floor(Math.min(time,duration-0.001)/beatLength)+direction)*beatLength)}
function play(){if(time>=duration)time=0;playing=true;last=performance.now();render()}
function pause(){playing=false;render()}
function replay(){time=0;sceneIndex=-1;play()}
function tick(now){if(playing){time=Math.min(duration,time+(now-last)/1000);if(time>=duration)playing=false;render()}last=now;requestAnimationFrame(tick)}
function hide(){const hidden=$('controls').classList.toggle('hidden');$('stage').classList.toggle('recording',hidden)}
async function fullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(error){console.warn('Fullscreen unavailable:',error.message)}}
$('sceneSelect').innerHTML=scenes.map((s,i)=>'<option value="'+i+'">'+(i+1)+'. '+s.name+'</option>').join('');$('sceneSelect').onchange=e=>seek(Number(e.target.value)*24);$('play').onclick=()=>playing?pause():play();$('replay').onclick=replay;$('seek').oninput=e=>seek(Number(e.target.value));$('capture').onclick=hide;$('fullscreen').onclick=fullscreen;
$('beats').onclick=e=>{const button=e.target.closest('button[data-beat]');if(button)seek(sceneIndex*chapterLength+Number(button.dataset.beat)*beatLength)};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select')){if(e.key==='Escape')e.target.blur();return}if(['Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')playing?pause():play();if(e.key.toLowerCase()==='r')replay();if(e.key.toLowerCase()==='h')hide();if(e.key.toLowerCase()==='f')fullscreen();if(e.code==='ArrowRight')stepHighlight(1);if(e.code==='ArrowLeft')stepHighlight(-1);if(/^[1-7]$/.test(e.key))seek((Number(e.key)-1)*24)});
// Only the preview scale changes. The authored stage always remains exactly 1920 × 1080.
function fit(){const scale=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform='scale('+scale+')'}
addEventListener('resize',fit);fit();render();requestAnimationFrame(tick);
window.animation={seek,play,pause,replay,get time(){return time},get playing(){return playing},duration,scenes};
</script>
</body>
</html>
