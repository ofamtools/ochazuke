            const blocks = [];
            const content = Array.isArray(entry.message.content) ? entry.message.content : [];
            for (let blockIndex = 0; blockIndex < content.length; blockIndex++) {
              const block = content[blockIndex];
              if (block.type === 'toolCall') {
                const result = results.get(block.id) || null;
                const ply = {
                  addr: current.no + '.' + (current.plies.length + 1),
                  call: block,
                  result,
                  size: resultSize(result),
                  entryId: entry.id,
                  blockIndex,
                  label: labelMap.get(entry.id),
                };
                current.plies.push(ply);
                blocks.push({ type: 'ply', ply, blockIndex });
              } else {
                blocks.push({ type: block.type, block, blockIndex });
              }
            }
            current.items.push({ kind: 'reply', entry, blocks });
          } else {
            current.items.push({ kind: 'event', entry });
          }
        }
        return moves;
      }

      // ============================================================
      // RENDERING: game text
      // ============================================================
      function copyLinkHtml(entryId, sctx) {
        if (sctx.prefix !== '') return '';
        return '<button class="copy-link-btn" type="button" data-entry-id="' + entryId + '" title="Copy a link to this entry" aria-label="Copy a link to this entry">§</button>';
      }

      function glyphHtml(glyph, title) {
        const cls = glyph === '!' ? 'glyph glyph--good' : glyph === '…' ? 'glyph glyph--quiet' : 'glyph';
        return '<span class="' + cls + '" title="' + escapeHtml(title) + '">' + glyph + '</span>';
      }

      function renderImages(parts, blockId) {
        const images = parts.filter(c => c && c.type === 'image');
        if (images.length === 0) return '';
        let html = '<figure class="plate"' + (blockId ? ' id="' + blockId + '"' : '') + '>';
        for (const img of images) {
          html += '<img src="data:' + img.mimeType + ';base64,' + img.data + '" class="message-image" alt="Image attached to the message">';
        }
        html += '</figure>';
        return html;
      }

      function renderMoveHead(move, sctx) {
        const entry = move.entry;
        if (!entry) {
          return '<header class="move-head move-head--pre"><span class="move-no">0.</span><p class="move-text move-text--pre">Before the first move</p></header>';
        }
        const msg = entry.message;
        const content = msg.content;
        const text = typeof content === 'string' ? content : extractContent(content);
        const label = labelMap.get(entry.id);
        let html = '<header class="move-head' + (msg.role === 'developer' ? ' move-head--developer' : '') + '" id="' + sctx.idPrefix + entry.id + '" data-move="' + move.no + '">';
        html += '<span class="move-no">' + move.no + '.</span>';
        html += '<div class="move-main">';
        if (label) html += '<p class="label-line">' + glyphHtml('!', 'Labeled') + escapeHtml(label) + '</p>';
        if (msg.role === 'developer') html += '<p class="move-role">Developer</p>';
        if (Array.isArray(content)) html += renderImages(content);
        if (text.trim()) html += '<div class="move-text markdown-content">' + safeMarkedParse(text) + '</div>';
        html += '</div>';
        html += '<div class="move-meta"><time class="move-time" datetime="' + escapeHtml(entry.timestamp || '') + '">' + formatClock(entry.timestamp) + '</time>' + copyLinkHtml(entry.id, sctx) + '</div>';
        html += '</header>';
        return html;
      }

      function renderPly(ply, sctx, anchorId) {
        const name = ply.call.name;
        const kind = toolKind(name);
        const status = ply.result ? (ply.result.isError ? 'err' : 'ok') : 'pending';
        const viewId = sctx.idPrefix + ply.entryId + '-block-' + ply.blockIndex;
        const frac = sizeFraction(ply.size);
        const size = sizeLabel(ply.size);
        let glyph = '';
        if (status === 'err') glyph = glyphHtml('??', 'This tool call failed');
        else if (status === 'pending') glyph = glyphHtml('…', 'No result recorded');
        if (ply.label) glyph += glyphHtml('!', ply.label);
        return '<li class="ply ply--' + kind + ' ply--' + status + '" data-addr="' + ply.addr + '"' + (anchorId ? ' id="' + anchorId + '"' : '') + '>' +
          '<button type="button" class="ply-btn" data-view="' + viewId + '" aria-expanded="false" title="Show or hide this tool call">' +
          '<span class="ply-no">' + ply.addr + '</span>' +
          '<span class="ply-tool">' + escapeHtml(name) + '</span>' +
          '<span class="ply-target">' + escapeHtml(toolTarget(name, ply.call.arguments)) + '</span>' +
          '<span class="ply-size"><i class="ply-bar" style="--w:' + frac.toFixed(3) + '"></i>' + escapeHtml(size) + '</span>' +
          glyph +
          '</button></li>';
      }

      function renderPlyView(ply, sctx) {
        const name = ply.call.name;
        const viewId = sctx.idPrefix + ply.entryId + '-block-' + ply.blockIndex;
        const inner = toolViewHtml(ply.call, ply.result, sctx, viewId + '-tv');
        const failed = ply.result && ply.result.isError;
        if (isDiagramTool(name)) {
          const path = argPath(ply.call.arguments || {});
          return '<figure class="diagram is-open" id="' + viewId + '" data-addr="' + ply.addr + '">' +
            '<figcaption class="diagram-caption"><span class="diagram-after">Position after ' + ply.addr + '</span>' + (path ? '<span class="diagram-path">' + escapeHtml(path) + '</span>' : '') + '</figcaption>' +
            inner + '</figure>';
        }
        return '<div class="view' + (failed ? ' is-open' : '') + '" id="' + viewId + '" data-addr="' + ply.addr + '">' + inner + '</div>';
      }

      function renderReply(item, sctx) {
        const entry = item.entry;
        const msg = entry.message;
        const label = labelMap.get(entry.id);
        let html = '<div class="reply" id="' + sctx.idPrefix + entry.id + '">';
        html += '<div class="reply-meta">' + copyLinkHtml(entry.id, sctx) + '<time class="reply-time" datetime="' + escapeHtml(entry.timestamp || '') + '">' + formatClock(entry.timestamp) + '</time></div>';
        if (label) html += '<p class="label-line">' + glyphHtml('!', 'Labeled') + escapeHtml(label) + '</p>';

        let i = 0;
        const blocks = item.blocks;
        while (i < blocks.length) {
          const b = blocks[i];
          const blockId = sctx.idPrefix + entry.id + '-block-' + b.blockIndex;
          if (b.type === 'ply') {
            // Consecutive plies form one variation line.
            const run = [];
            while (i < blocks.length && blocks[i].type === 'ply') run.push(blocks[i].ply), i++;
            html += '<div class="line"><ol class="plies">' + run.map(p => renderPly(p, sctx)).join('') + '</ol>';
            html += '<div class="views">' + run.map(p => renderPlyView(p, sctx)).join('') + '</div></div>';
            continue;
          }
          if (b.type === 'text') {
            if (canonicalizeMessage(b.block.text)) html += '<div class="commentary markdown-content" id="' + blockId + '">' + safeMarkedParse(b.block.text) + '</div>';
          } else if (b.type === 'thinking') {
            const thinking = canonicalizeMessage(b.block.thinking);
            if (thinking) {
              html += '<div class="thinking" id="' + blockId + '"><button type="button" class="thinking-toggle" aria-expanded="false">Thinking</button><div class="thinking-text">' + escapeHtml(thinking) + '</div></div>';
            }
          } else if (b.type === 'image') {
            html += renderImages([b.block], blockId);
          }
          i++;
        }

        if (msg.stopReason === 'aborted') {
          html += '<p class="glyph-line">' + glyphHtml('?!', 'The reply was aborted') + 'Aborted</p>';
        } else if (msg.stopReason === 'error') {
          html += '<p class="glyph-line glyph-line--err">' + glyphHtml('??', 'The reply failed') + escapeHtml(msg.errorMessage || 'Unknown error') + '</p>';
        }
        html += '</div>';
        return html;
      }

      function formatExpandableOutput(text, maxLines) {
        text = replaceTabs(text);
        const lines = text.split('\n');
        const remaining = lines.length - maxLines;
        if (remaining > 0) {
          return '<details class="output"><summary>' + escapeHtml(lines.slice(0, maxLines).join('\n')) + '<span class="output-more">' + remaining + ' more lines</span></summary><pre class="output-full">' + escapeHtml(text) + '</pre></details>';
        }
        return '<pre class="output">' + escapeHtml(text) + '</pre>';
      }

      function renderEvent(item, sctx) {
        const entry = item.entry;
        const id = sctx.idPrefix + entry.id;
        const label = labelMap.get(entry.id);
        const labelHtml = label ? '<p class="label-line">' + glyphHtml('!', 'Labeled') + escapeHtml(label) + '</p>' : '';
        const time = '<time class="note-time" datetime="' + escapeHtml(entry.timestamp || '') + '">' + formatClock(entry.timestamp) + '</time>';

        if (entry.type === 'message') {
          const msg = entry.message;
          if (msg.role === 'bashExecution' || msg.role === 'jsExecution') {
            const isError = msg.cancelled || (msg.exitCode !== 0 && msg.exitCode !== null);
            const cmd = msg.role === 'bashExecution' ? msg.command : msg.code;
            let html = '<div class="shell' + (isError ? ' shell--err' : '') + '" id="' + id + '">' + labelHtml;
            html += '<div class="shell-cmd"><span class="shell-prompt">' + (msg.role === 'bashExecution' ? '$' : 'js') + '</span> ' + escapeHtml(cmd || '') + '</div>';
            if (msg.output) html += formatExpandableOutput(msg.output, 10);
            if (msg.cancelled) html += '<p class="glyph-line">' + glyphHtml('?!', 'Cancelled') + 'Cancelled</p>';
            else if (isError) html += '<p class="glyph-line glyph-line--err">' + glyphHtml('??', 'Non-zero exit') + 'exit ' + msg.exitCode + '</p>';
            html += '</div>';
            return html;
          }
          return '';
        }

        switch (entry.type) {
          case 'title_change':
            return '<p class="note note--title" id="' + id + '">' + labelHtml + '<span class="note-key">Title</span>' + escapeHtml(entry.title || '') + time + '</p>';
          case 'model_change':
            return '<p class="note" id="' + id + '">' + labelHtml + '<span class="note-key">Model</span>' + escapeHtml(entry.model || '') + time + '</p>';
          case 'thinking_level_change':
            return '<p class="note" id="' + id + '">' + labelHtml + '<span class="note-key">Thinking</span>' + escapeHtml(entry.thinkingLevel || '') + time + '</p>';
          case 'mode_change':
            return '<p class="note" id="' + id + '">' + labelHtml + '<span class="note-key">Mode</span>' + escapeHtml(entry.mode || '') + time + '</p>';
          case 'service_tier_change':
            return entry.serviceTier ? '<p class="note" id="' + id + '">' + labelHtml + '<span class="note-key">Service tier</span>' + escapeHtml(entry.serviceTier) + time + '</p>' : '';
          case 'credential_pin':
            return '<p class="note" id="' + id + '">' + labelHtml + '<span class="note-key">Credential</span>' + escapeHtml(entry.provider || 'pinned') + time + '</p>';
          case 'ttsr_injection': {
            const rules = Array.isArray(entry.injectedRules) ? entry.injectedRules.join(', ') : '';
            return '<p class="note" id="' + id + '">' + labelHtml + '<span class="note-key">Rules</span>' + escapeHtml(rules) + time + '</p>';
          }
          case 'compaction': {
            const before = entry.tokensBefore ? entry.tokensBefore.toLocaleString() : '?';
            return '<details class="fold fold--compaction" id="' + id + '">' + labelHtml + '<summary><span class="fold-glyph">≈</span><span class="fold-title">Compaction</span><span class="fold-sub">' + before + ' tokens folded into a summary</span>' + time + '</summary><div class="fold-body"><pre class="plain">' + escapeHtml(entry.summary || '') + '</pre></div></details>';
          }
          case 'branch_summary':
            return '<aside class="branch-note" id="' + id + '">' + labelHtml + '<p class="branch-note-title">Branch summary' + time + '</p><div class="markdown-content">' + safeMarkedParse(entry.summary || '') + '</div></aside>';
          case 'custom_message': {
            if (!entry.display) return '';
            const content = typeof entry.content === 'string' ? entry.content : JSON.stringify(entry.content);
            return '<details class="fold fold--system" id="' + id + '">' + labelHtml + '<summary><span class="fold-glyph">§</span><span class="fold-title">' + escapeHtml(entry.customType || 'system') + '</span><span class="fold-sub">' + escapeHtml(firstLine(content, 90)) + '</span>' + time + '</summary><div class="fold-body markdown-content">' + safeMarkedParse(content) + '</div></details>';
          }
          default:
            return '';
        }
      }

      // A reply with no prose is pure notation; consecutive ones merge into a
      // single strip, with their thinking folded once and settings notes after.
      function isNotationOnly(item) {
        if (item.kind !== 'reply') return false;
        const msg = item.entry.message;
        if (msg.stopReason === 'aborted' || msg.stopReason === 'error') return false;
        return item.blocks.every(b => b.type === 'ply' || b.type === 'thinking') && item.blocks.some(b => b.type === 'ply');
      }
      function isSettingsEvent(item) {
        return item.kind === 'event' && SETTINGS_TYPES.has(item.entry.type);
      }

      function renderRun(run, sctx) {
        const first = run[0].entry;
        const thoughts = [];
        const plies = [];
        for (const item of run) {
          for (const b of item.blocks) {
            if (b.type === 'ply') plies.push({ ply: b.ply, entryId: item.entry.id, first: plies.length === 0 || plies[plies.length - 1].entryId !== item.entry.id });
            else if (b.type === 'thinking') {
              const t = canonicalizeMessage(b.block.thinking);
              if (t) thoughts.push({ id: sctx.idPrefix + item.entry.id + '-block-' + b.blockIndex, text: t });
            }
          }
        }
        let html = '<div class="reply reply--run">';
        html += '<div class="reply-meta"><time class="reply-time" datetime="' + escapeHtml(first.timestamp || '') + '">' + formatClock(first.timestamp) + '</time></div>';
        if (thoughts.length) {
          html += '<div class="thinking thinking--run"><button type="button" class="thinking-toggle" aria-expanded="false">Thinking' + (thoughts.length > 1 ? ' <span class="thinking-count">' + thoughts.length + '</span>' : '') + '</button><div class="thinking-text">' +
            thoughts.map(t => '<p id="' + t.id + '">' + escapeHtml(t.text) + '</p>').join('') + '</div></div>';
        }
        html += '<div class="line"><ol class="plies">' + plies.map(p => renderPly(p.ply, sctx, p.first ? sctx.idPrefix + p.entryId : null)).join('') + '</ol>';
        html += '<div class="views">' + plies.map(p => renderPlyView(p.ply, sctx)).join('') + '</div></div>';
        html += '</div>';
        return html;
      }

      function renderMove(move, sctx) {
        const bodyParts = [];
        const items = move.items;
        let i = 0;
        while (i < items.length) {
          const item = items[i];
          if (isNotationOnly(item)) {
            const run = [];
            const deferred = [];
            while (i < items.length && (isNotationOnly(items[i]) || (run.length && isSettingsEvent(items[i])))) {
              if (items[i].kind === 'reply') run.push(items[i]); else deferred.push(items[i]);
              i++;
            }
            bodyParts.push(renderRun(run, sctx));
            for (const d of deferred) bodyParts.push(renderEvent(d, sctx));
            continue;
          }
          bodyParts.push(item.kind === 'reply' ? renderReply(item, sctx) : renderEvent(item, sctx));
          i++;
        }
        const body = bodyParts.join('');
        if (!move.entry && !body.trim()) return '';
        const anchor = move.entry ? move.entry.id : 'pre';
        return '<section class="move" data-move="' + move.no + '" data-entry-id="' + anchor + '">' + renderMoveHead(move, sctx) + '<div class="move-body">' + body + '</div></section>';
      }

      function renderPath(path, sctx) {
        const moves = buildMoves(path, sctx);
        return moves.map(m => renderMove(m, sctx)).join('');
      }

      // ============================================================
      // RENDERING: game heading
      // ============================================================
      function computeStats(entryList) {
        let userMessages = 0, developerMessages = 0, assistantMessages = 0, toolResults = 0;
        let customMessages = 0, compactions = 0, branchSummaries = 0, toolCalls = 0, failedCalls = 0;
        const tokens = { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 };
        const cost = { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 };
        const models = new Set();
        for (const entry of entryList) {
          if (entry.type === 'message') {
            const msg = entry.message;
            if (msg.role === 'user') userMessages++;
            if (msg.role === 'developer') developerMessages++;
            if (msg.role === 'assistant') {
              assistantMessages++;
              if (msg.model) models.add(msg.provider ? msg.provider + '/' + msg.model : msg.model);
              if (msg.usage) {
                tokens.input += msg.usage.input || 0;
                tokens.output += msg.usage.output || 0;
                tokens.cacheRead += msg.usage.cacheRead || 0;
                tokens.cacheWrite += msg.usage.cacheWrite || 0;
                if (msg.usage.cost) {
                  cost.input += msg.usage.cost.input || 0;
                  cost.output += msg.usage.cost.output || 0;
                  cost.cacheRead += msg.usage.cost.cacheRead || 0;
                  cost.cacheWrite += msg.usage.cost.cacheWrite || 0;
                }
              }
              if (Array.isArray(msg.content)) toolCalls += msg.content.filter(c => c.type === 'toolCall').length;
            }
            if (msg.role === 'toolResult') {
              toolResults++;
              if (msg.isError) failedCalls++;
            }
          } else if (entry.type === 'compaction') compactions++;
          else if (entry.type === 'branch_summary') branchSummaries++;
          else if (entry.type === 'custom_message') customMessages++;
        }
        return { userMessages, developerMessages, assistantMessages, toolResults, customMessages, compactions, branchSummaries, toolCalls, failedCalls, tokens, cost, models: Array.from(models) };
      }

      function stat(term, value) {
        return '<div class="score-cell"><dt>' + term + '</dt><dd>' + value + '</dd></div>';
      }

      function renderHeader(path) {
        const stats = computeStats(entries);
        const onPath = computeStats(path);
        const totalCost = stats.cost.input + stats.cost.output + stats.cost.cacheRead + stats.cost.cacheWrite;
        const t = stats.tokens;
        const tokenParts = [];
        if (t.input) tokenParts.push('<span class="tok"><span class="tok-key">in</span>' + formatTokens(t.input) + '</span>');
        if (t.output) tokenParts.push('<span class="tok"><span class="tok-key">out</span>' + formatTokens(t.output) + '</span>');
        if (t.cacheRead) tokenParts.push('<span class="tok"><span class="tok-key">cached</span>' + formatTokens(t.cacheRead) + '</span>');
        if (t.cacheWrite) tokenParts.push('<span class="tok"><span class="tok-key">written</span>' + formatTokens(t.cacheWrite) + '</span>');

        const title = (header && header.title) || 'Untitled session';
        const models = stats.models.length ? stats.models.map(m => escapeHtml(m)).join(', ') : 'unknown model';
        const site = shortenPath((header && header.cwd) || '');
        const subCount = subSessions ? Object.keys(subSessions).length : 0;
        const branchCount = Math.max(0, entries.length - path.length);
        const moveCount = onPath.userMessages + onPath.developerMessages;

        let html = '<header class="game">';
        html += '<h1 class="game-title">' + escapeHtml(title) + '</h1>';
        html += '<p class="game-players"><span class="player">You</span><span class="players-dash" aria-hidden="true">—</span><span class="player">' + models + '</span></p>';
        html += '<p class="game-site">' + (site ? '<span class="site-path">' + escapeHtml(site) + '</span>' : '') + '<span class="site-date">' + escapeHtml(formatLongDate(header && header.timestamp)) + '</span>' + (header && header.id ? '<span class="site-id">' + escapeHtml(header.id) + '</span>' : '') + '</p>';
        html += '<dl class="scoresheet">';
        html += stat('Moves', moveCount);
        html += stat('Replies', onPath.assistantMessages);
        html += stat('Tool calls', onPath.toolCalls + (onPath.failedCalls ? ' <span class="score-failed" title="' + onPath.failedCalls + ' failed"><span class="glyph">??</span>' + onPath.failedCalls + '</span>' : ''));
        if (tokenParts.length) html += stat('Tokens', tokenParts.join(''));
        if (totalCost) html += stat('Cost', '$' + totalCost.toFixed(2));
        if (subCount) html += stat('Sub-games', subCount);
        if (stats.compactions) html += stat('Compactions', stats.compactions);
        if (branchCount) html += stat('Other branches', branchCount + ' entries');
        html += '</dl>';

        if (systemPrompt) {
          html += '<details class="fold fold--appendix"><summary><span class="fold-title">System prompt</span></summary><div class="fold-body"><pre class="plain">' + escapeHtml(systemPrompt) + '</pre></div></details>';
        }
        if (tools && tools.length > 0) {
          html += '<details class="fold fold--appendix"><summary><span class="fold-title">Tools</span><span class="fold-sub">' + tools.length + ' available</span></summary><div class="fold-body"><dl class="tool-index">' +
            tools.map(tl => '<div class="tool-index-row"><dt>' + escapeHtml(tl.name) + '</dt><dd>' + escapeHtml(tl.description || '') + '</dd></div>').join('') + '</dl></div></details>';
        }
        html += '<p class="keys"><kbd>←</kbd><kbd>→</kbd> moves <span class="keys-sep"></span><kbd>T</kbd> thinking <span class="keys-sep"></span><kbd>O</kbd> tool views <span class="keys-sep"></span><kbd>Esc</kbd> back to the end</p>';
        html += '</header>';
        return html;
      }

      // ============================================================
      // STUDY PANEL: the move list
      // ============================================================
      let filterMode = 'default';
      let searchQuery = '';
      let currentLeafId = leafId;
      let currentActiveIds = new Set();

      // Rows: one per move, in tree order, with variations nested where the
      // line forks. Built once per leaf change (the main line depends on it).
      let panelRows = [];

      function buildPanelRows() {
        activeCache.clear();
        const results = resultMapFor(entries);
        const rows = [];

        function newRow(no, entry, depth) {
          return { no, entry, depth, text: '', replies: [], plies: [], notes: [], variations: [], label: entry ? labelMap.get(entry.id) : undefined, search: '' };
        }

        function walk(startNode, moveNoStart, depth, out) {
          let node = startNode;
          let moveNo = moveNoStart;
          let row = null;
          const ensureRow = () => {
            if (!row) {
              row = newRow(moveNo, null, depth);
              out.push(row);
            }
          };
          while (node) {
            const entry = node.entry;
            if (isPromptEntry(entry)) {
              moveNo++;
              row = newRow(moveNo, entry, depth);
              row.text = firstLine(extractContent(entry.message.content), 120) || '(image)';
              out.push(row);
            } else if (entry.type === 'message' && entry.message.role === 'assistant') {
              ensureRow();
              const msg = entry.message;
              const content = Array.isArray(msg.content) ? msg.content : [];
              const text = firstLine(extractContent(content), 140);
              if (text) row.replies.push({ entryId: entry.id, text, label: node.label });
              else if (msg.stopReason && msg.stopReason !== 'stop' && msg.stopReason !== 'toolUse') row.replies.push({ entryId: entry.id, text: msg.errorMessage || msg.stopReason, label: node.label, err: true });
              else if (node.label) row.replies.push({ entryId: entry.id, text: '', label: node.label });
              for (let blockIndex = 0; blockIndex < content.length; blockIndex++) {
                const block = content[blockIndex];
                if (block.type !== 'toolCall') continue;
                const result = results.get(block.id) || null;
                row.plies.push({
                  addr: row.no + '.' + (row.plies.length + 1),
                  name: block.name,
                  kind: toolKind(block.name),
                  status: result ? (result.isError ? 'err' : 'ok') : 'pending',
                  target: toolTarget(block.name, block.arguments),
                  entryId: entry.id,
                  viewId: mainSctx.idPrefix + entry.id + '-block-' + blockIndex,
                });
              }
            } else if (entry.type === 'message' && entry.message.role === 'toolResult') {
              if (node.label) { ensureRow(); row.notes.push({ entryId: entry.id, text: 'tool result', label: node.label, settings: false }); }
            } else if (entry.type === 'custom') {
              if (node.label) { ensureRow(); row.notes.push({ entryId: entry.id, text: entry.customType || 'custom', label: node.label, settings: true }); }
            } else if (entry.type !== 'label') {
              ensureRow();
              row.notes.push({ entryId: entry.id, text: noteText(entry), label: node.label, settings: SETTINGS_TYPES.has(entry.type) });
            }

            const children = node.children;
            if (children.length === 0) break;
            if (children.length === 1) { node = children[0]; continue; }
            const ordered = [...children].sort((a, b) => Number(subtreeHasActive(b, currentActiveIds)) - Number(subtreeHasActive(a, currentActiveIds)));
            const main = ordered[0];
            ensureRow();
            for (let i = 1; i < ordered.length; i++) {
              const branchRows = [];
              walk(ordered[i], moveNo, depth + 1, branchRows);
              if (branchRows.length) row.variations.push({ rows: branchRows, leafId: leafOf(ordered[i], currentActiveIds), first: ordered[i].entry });
            }
            node = main;
          }
        }

        const orderedRoots = [...treeRoots].sort((a, b) => Number(subtreeHasActive(b, currentActiveIds)) - Number(subtreeHasActive(a, currentActiveIds)));
        if (orderedRoots.length) walk(orderedRoots[0], 0, 0, rows);
        for (let i = 1; i < orderedRoots.length; i++) {
          const branchRows = [];
          walk(orderedRoots[i], 0, 1, branchRows);
          if (branchRows.length && rows.length) rows[rows.length - 1].variations.push({ rows: branchRows, leafId: leafOf(orderedRoots[i], currentActiveIds), first: orderedRoots[i].entry });
        }

        // Searchable text per row.
        const index = (list) => {
          for (const r of list) {
            const parts = [String(r.no), r.text, r.label || ''];
            for (const rp of r.replies) parts.push(rp.text, rp.label || '');
            for (const p of r.plies) parts.push(p.addr, p.name, p.target);
            for (const n of r.notes) parts.push(n.text, n.label || '');
            r.search = parts.join(' ').toLowerCase();
            for (const v of r.variations) index(v.rows);
          }
        };
        index(rows);
        return rows;
      }

      function noteText(entry) {
        switch (entry.type) {
          case 'title_change': return 'Title: ' + (entry.title || '');
          case 'model_change': return 'Model: ' + (entry.model || '');
          case 'thinking_level_change': return 'Thinking: ' + (entry.thinkingLevel || '');
          case 'mode_change': return 'Mode: ' + (entry.mode || '');
          case 'service_tier_change': return 'Service tier: ' + (entry.serviceTier || 'default');
          case 'credential_pin': return 'Credential: ' + (entry.provider || 'pinned');
          case 'ttsr_injection': return 'Rules: ' + (Array.isArray(entry.injectedRules) ? entry.injectedRules.join(', ') : '');
          case 'compaction': return 'Compaction: ' + (entry.tokensBefore ? Math.round(entry.tokensBefore / 1000) + 'k tokens' : '');
          case 'branch_summary': return 'Branch summary: ' + firstLine(entry.summary || '', 80);
          case 'custom_message': return (entry.customType || 'system') + ': ' + firstLine(typeof entry.content === 'string' ? entry.content : extractContent(entry.content), 80);
          case 'message': {
            const m = entry.message;
            if (m.role === 'bashExecution') return '$ ' + firstLine(m.command || '', 80);
            if (m.role === 'jsExecution') return 'js ' + firstLine(m.code || '', 80);
            return m.role;
          }
          default: return entry.type;
        }
      }

      function rowMatches(row, tokens) {
        if (tokens.length === 0) return true;
        return tokens.every(t => row.search.includes(t));
      }

      function rowIsVisible(row, tokens) {
        if (filterMode === 'labeled-only') {
          const labeled = row.label || row.replies.some(r => r.label) || row.notes.some(n => n.label) || row.plies.some(p => labelMap.get(p.entryId));
          if (!labeled && !row.variations.some(v => v.rows.some(r => rowIsVisible(r, tokens)))) return false;
        }
        if (rowMatches(row, tokens)) return true;
        return row.variations.some(v => v.rows.some(r => rowIsVisible(r, tokens)));
      }

      function renderRow(row, tokens, onLine, counter) {
        if (!rowIsVisible(row, tokens)) return '';
        if (row.entry) counter.shown++;
        const entryId = row.entry ? row.entry.id : null;
        const isCurrent = entryId && entryId === inPlayEntryId;
        const showReplies = filterMode === 'no-tools' || filterMode === 'all' || filterMode === 'labeled-only';
        const showConclusion = filterMode === 'default';
        const showPlies = filterMode === 'default' || filterMode === 'all' || filterMode === 'labeled-only';
        const showNotes = filterMode === 'all' || filterMode === 'labeled-only';

        if (!row.entry) {
          const visibleNotes = row.notes.filter(n => (filterMode === 'all' || n.label) && (filterMode !== 'labeled-only' || n.label));
          const visibleReplies = row.replies.filter(r => filterMode !== 'labeled-only' || r.label);
          const hasVariations = row.variations.some(v => v.rows.some(r => rowIsVisible(r, tokens)));
          if (!visibleNotes.length && !visibleReplies.length && !row.plies.length && !hasVariations) return '';
        }
        let html = '<div class="mv' + (isCurrent ? ' is-current' : '') + (onLine ? '' : ' mv--off') + (row.entry ? '' : ' mv--pre') + '" data-entry-id="' + (entryId || '') + '" data-move="' + row.no + '">';
        html += '<button type="button" class="mv-head" data-entry-id="' + (entryId || '') + '">';
        html += '<span class="mv-no">' + (row.entry ? row.no + '.' : (row.no === 0 ? '0.' : '')) + '</span>';
        html += '<span class="mv-text">' + (row.label ? glyphHtml('!', row.label) : '') + escapeHtml(row.entry ? row.text : (row.no === 0 ? 'Before the first move' : 'After move ' + row.no)) + '</span>';
        html += '</button>';

        const replies = showReplies ? row.replies : (showConclusion && row.replies.length ? [row.replies[row.replies.length - 1]] : []);
        const labeledOnly = filterMode === 'labeled-only';
        for (const rp of replies) {
          if (labeledOnly && !rp.label) continue;
          html += '<button type="button" class="mv-reply' + (rp.err ? ' mv-reply--err' : '') + '" data-entry-id="' + rp.entryId + '">' + (rp.label ? glyphHtml('!', rp.label) : '') + (rp.err ? glyphHtml('??', 'The reply failed') : '') + escapeHtml(rp.text) + '</button>';
        }
        if (showPlies && row.plies.length) {
          const everything = filterMode === 'all' || tokens.length > 0;
          const isKey = (p) => p.kind === 'write' || p.kind === 'edit' || p.kind === 'task' || p.status === 'err' || labelMap.get(p.entryId);
          const shown = row.plies.filter(p => (everything || isKey(p)) && (!labeledOnly || labelMap.get(p.entryId)));
          if (!everything) {
            const counts = new Map();
            for (const p of row.plies) counts.set(p.name, (counts.get(p.name) || 0) + 1);
            const summary = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]).map(([n, c]) => c + ' ' + n).join(', ');
            html += '<p class="mv-line"><span class="mv-line-count">' + row.plies.length + (row.plies.length === 1 ? ' ply' : ' plies') + '</span>' + escapeHtml(summary) + '</p>';
          }
          if (shown.length) {
            const CAP = 24;
            html += '<ol class="mv-plies">';
            shown.forEach((p, idx) => {
              html += '<li' + (idx >= CAP ? ' class="mv-ply-extra"' : '') + '><button type="button" class="mv-ply mv-ply--' + p.kind + ' mv-ply--' + p.status + '" data-entry-id="' + p.entryId + '" data-view="' + p.viewId + '" title="' + escapeHtml(p.addr + ' ' + p.name + ' ' + p.target) + '"><span class="mv-ply-no">' + p.addr.split('.')[1] + '</span>' + escapeHtml(p.name) + (p.status === 'err' ? '<span class="glyph">??</span>' : '') + '</button></li>';
            });
            if (shown.length > CAP) html += '<li><button type="button" class="mv-more" aria-expanded="false">' + (shown.length - CAP) + ' more</button></li>';
            html += '</ol>';
          }
        }
        if (showNotes) {
          for (const n of row.notes) {
            if (labeledOnly && !n.label) continue;
            if (n.settings && filterMode !== 'all' && !n.label) continue;
            html += '<button type="button" class="mv-note" data-entry-id="' + n.entryId + '">' + (n.label ? glyphHtml('!', n.label) : '') + escapeHtml(n.text) + '</button>';
          }
        }
        for (const v of row.variations) {
          const inner = v.rows.map(r => renderRow(r, tokens, false, counter)).join('');
          if (!inner) continue;
          html += '<div class="variation" data-leaf-id="' + v.leafId + '"><span class="variation-paren" aria-hidden="true">(</span>' + inner + '<span class="variation-paren variation-paren--close" aria-hidden="true">)</span></div>';
        }
        html += '</div>';
        return html;
      }

      let inPlayEntryId = null;

      function renderPanel() {
        const tokens = searchQuery.toLowerCase().split(/\s+/).filter(Boolean);
        const counter = { shown: 0 };
        const html = panelRows.map(r => renderRow(r, tokens, true, counter)).join('');
        const container = document.getElementById('tree-container');
        container.innerHTML = html || '<p class="study-empty">Nothing matches.</p>';
        const total = countRows(panelRows);
        document.getElementById('tree-status').textContent = total === counter.shown ? total + ' moves' : counter.shown + ' of ' + total + ' moves';
      }

      function countRows(list) {
        let n = 0;
        for (const r of list) {
          if (r.entry) n++;
          for (const v of r.variations) n += countRows(v.rows);
        }
        return n;
      }

      function syncPanelCurrent() {
        const container = document.getElementById('tree-container');
        container.querySelectorAll('.mv.is-current').forEach(el => el.classList.remove('is-current'));
        if (!inPlayEntryId) return;
        const el = container.querySelector('.mv[data-entry-id="' + inPlayEntryId + '"]');
        if (!el) return;
        el.classList.add('is-current');
        const box = container.getBoundingClientRect();
        const r = el.getBoundingClientRect();
        if (r.top < box.top || r.bottom > box.bottom) el.scrollIntoView({ block: 'nearest' });
      }

      // ============================================================
      // NAVIGATION
      // ============================================================
      let currentPath = [];

      function navigateTo(targetId, scrollMode = 'target', scrollToEntryId = null, scrollTargetDomId = null) {
        const leafChanged = currentLeafId !== targetId || currentPath.length === 0;
        currentLeafId = targetId;
        currentPath = getPath(targetId);
        currentActiveIds = buildActivePathIds(targetId);

        if (leafChanged) {
          document.getElementById('header-container').innerHTML = renderHeader(currentPath);
          document.getElementById('messages').innerHTML = renderPath(currentPath, mainSctx);
          panelRows = buildPanelRows();
          renderPanel();
        }

        setTimeout(() => {
          const content = document.getElementById('content');
          if (scrollMode === 'bottom') {
            content.scrollTop = content.scrollHeight;
          } else if (scrollMode === 'target') {
            const scrollTargetId = scrollToEntryId || targetId;
            const targetEl = document.getElementById(scrollTargetDomId || ('entry-' + scrollTargetId));
            if (targetEl) {
              targetEl.scrollIntoView({ block: 'center' });
              if (scrollToEntryId || scrollTargetDomId) flash(targetEl);
            }
          }
          updateInPlay();
        }, 0);
      }

      function flash(el) {
        el.classList.add('highlight');
        setTimeout(() => el.classList.remove('highlight'), 1600);
      }

      // Go to an entry: scroll when it is on the current line, otherwise switch lines.
      function goToEntry(entryId, viewId) {
        if (!entryId) return;
        if (currentActiveIds.has(entryId)) {
          const el = document.getElementById(viewId || ('entry-' + entryId));
          if (viewId) openView(viewId, true);
          if (el) {
            el.scrollIntoView({ block: viewId ? 'center' : 'start' });
            flash(el);
          }
        } else {
          const node = treeNodes.get(entryId);
          const leaf = node ? leafOf(node, currentActiveIds) : entryId;
          navigateTo(leaf, 'target', entryId, viewId || null);
          if (viewId) setTimeout(() => openView(viewId, true), 0);
        }
        if (isMobileLayout()) closeSidebar();
      }

      function goToMove(no, plyNo) {
        const head = document.querySelector('.move-head[data-move="' + no + '"]');
        if (!head) return false;
        if (plyNo) {
          const ply = document.querySelector('.ply[data-addr="' + no + '.' + plyNo + '"] .ply-btn');
          if (ply) {
            openView(ply.dataset.view, true);
            const view = document.getElementById(ply.dataset.view);
            (view || ply).scrollIntoView({ block: 'center' });
            flash(view || ply);
            return true;
          }
        }
        head.scrollIntoView({ block: 'start' });
        flash(head);
        return true;
      }

      function stepMove(delta) {
        const heads = Array.from(document.querySelectorAll('.move-head[data-move]'));
        if (!heads.length) return;
        const current = heads.findIndex(h => h.closest('.move').classList.contains('in-play'));
        let next = current + delta;
        if (current === -1) next = delta > 0 ? 0 : heads.length - 1;
        next = Math.max(0, Math.min(heads.length - 1, next));
        heads[next].scrollIntoView({ block: 'start' });
      }

      // ============================================================
      // IN PLAY: the move under the reader's eye
      // ============================================================
      const contentEl = document.getElementById('content');
      let inPlayPending = false;

      function updateInPlay() {
        const moves = document.querySelectorAll('#messages .move');
        if (!moves.length) return;
        const line = contentEl.getBoundingClientRect().top + Math.min(160, contentEl.clientHeight * 0.3);
        let chosen = moves[0];
        for (const m of moves) {
          if (m.getBoundingClientRect().top <= line) chosen = m; else break;
        }
        if (chosen.classList.contains('in-play')) return;
        moves.forEach(m => m.classList.remove('in-play'));
        chosen.classList.add('in-play');
        const id = chosen.dataset.entryId;
        inPlayEntryId = id && id !== 'pre' ? id : null;
        syncPanelCurrent();
      }

      contentEl.addEventListener('scroll', () => {
        if (inPlayPending) return;
        inPlayPending = true;
        requestAnimationFrame(() => { inPlayPending = false; updateInPlay(); });
      }, { passive: true });

      // ============================================================
      // VIEWS: unfold a ply's tool view
      // ============================================================
      function openView(viewId, open) {
        const view = document.getElementById(viewId);
        if (!view) return;
        const next = open === undefined ? !view.classList.contains('is-open') : open;
        view.classList.toggle('is-open', next);
        document.querySelectorAll('.ply-btn[data-view="' + viewId + '"]').forEach(b => b.setAttribute('aria-expanded', String(next)));
      }

      let thinkingExpanded = false;
      let toolViewsExpanded = false;

      function toggleThinking() {
        thinkingExpanded = !thinkingExpanded;
        document.body.classList.toggle('thinking-open', thinkingExpanded);
        document.querySelectorAll('.thinking').forEach(el => {
          el.classList.toggle('is-open', thinkingExpanded);
          const b = el.querySelector('.thinking-toggle');
          if (b) b.setAttribute('aria-expanded', String(thinkingExpanded));
        });
      }

      function toggleToolViews() {
        toolViewsExpanded = !toolViewsExpanded;
        document.querySelectorAll('#messages .view, #messages .diagram').forEach(el => openView(el.id, toolViewsExpanded));
        document.querySelectorAll('#messages details.fold--compaction, #messages details.output').forEach(el => { el.open = toolViewsExpanded; });
      }

      // ============================================================
      // SUB-SESSIONS (sub-games)
      // ============================================================
      function joinKey(prefix, id) {
        return prefix ? prefix + '/' + id : id;
      }

      function lookupSubSession(prefix, id) {
        return subSessions ? subSessions[joinKey(prefix, id)] : undefined;
      }

      const subSctxCache = new Map();
      function getSubSctx(key) {
        let sctx = subSctxCache.get(key);
        if (!sctx) {
          sctx = { entries: subSessions[key].entries, prefix: key, idPrefix: 'sub-' + key.replace(/[^A-Za-z0-9_-]/g, '_') + '-entry-' };
          subSctxCache.set(key, sctx);
        }
        return sctx;
      }

      function getPathIn(entryList, targetId) {
        const map = new Map();
        for (const e of entryList) map.set(e.id, e);
        let current = targetId ? map.get(targetId) : undefined;
        if (!current && entryList.length > 0) current = entryList[entryList.length - 1];
        const path = [];
        while (current) {
          path.unshift(current);
          if (!current.parentId || current.parentId === current.id) break;
          current = map.get(current.parentId);
        }
        return path;
      }

      const overlayStack = [];
      const subSessionBodyCache = new Map();
      let subOverlayEl = null;
      let subOverlayLastFocus = null;

      function ensureSubOverlay() {
        if (subOverlayEl) return subOverlayEl;
        subOverlayEl = document.createElement('div');
        subOverlayEl.id = 'subsession-overlay';
        subOverlayEl.innerHTML =
          '<div class="subsession-backdrop"></div>' +
          '<div class="subsession-panel" role="dialog" aria-modal="true" aria-label="Sub-game" tabindex="-1">' +
            '<div class="subsession-header">' +
              '<nav class="subsession-breadcrumb" aria-label="Sub-game breadcrumb"></nav>' +
              '<button type="button" class="subsession-close" title="Close (Esc)" aria-label="Close the sub-game">Close</button>' +
            '</div>' +
            '<div class="subsession-meta"></div>' +
            '<div class="subsession-body game-text"></div>' +
          '</div>';
        subOverlayEl.querySelector('.subsession-backdrop').addEventListener('click', popSubSession);
        subOverlayEl.querySelector('.subsession-close').addEventListener('click', closeAllSubSessions);
        document.body.appendChild(subOverlayEl);
        return subOverlayEl;
      }

      function buildSubSessionBody(key) {
        let body = subSessionBodyCache.get(key);
        if (body) return body;
        const sub = subSessions[key];
        const sctx = getSubSctx(key);
        body = document.createElement('div');
        body.className = 'subsession-messages';
        body.innerHTML = renderPath(getPathIn(sub.entries, sub.leafId), sctx);
        if (!body.firstChild) {
          body.innerHTML = '<p class="subsession-empty">Nothing to show for this sub-game.</p>';
        }
        subSessionBodyCache.set(key, body);
        return body;
      }

      function subSessionMetaText(key) {
        const sub = subSessions[key];
        const stats = computeStats(sub.entries);
        const parts = [];
        if (stats.models.length > 0) parts.push(stats.models.join(', '));
        parts.push((stats.userMessages + stats.developerMessages) + ' moves');
        parts.push(stats.toolCalls + ' tool calls');
        return parts.join(' · ');
      }

      function renderSubOverlay() {
        const key = overlayStack[overlayStack.length - 1];
        const el = ensureSubOverlay();
        const crumbs = el.querySelector('.subsession-breadcrumb');
        crumbs.innerHTML = '';
        const root = document.createElement('span');
        root.className = 'subsession-crumb subsession-crumb--root';
        root.textContent = 'Sub-game';
        crumbs.appendChild(root);
        const segments = key.split('/');
        for (let i = 0; i < segments.length; i++) {
          const sep = document.createElement('span');
          sep.className = 'subsession-crumb-sep';
          sep.textContent = '›';
          crumbs.appendChild(sep);
          if (i === segments.length - 1) {
            const span = document.createElement('span');
            span.className = 'subsession-crumb current';
            span.textContent = segments[i];
            crumbs.appendChild(span);
          } else {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'subsession-crumb';
            btn.textContent = segments[i];
            const ancestorKey = segments.slice(0, i + 1).join('/');
            btn.addEventListener('click', () => popSubSessionTo(ancestorKey));
            crumbs.appendChild(btn);
          }
        }
        el.querySelector('.subsession-meta').textContent = subSessionMetaText(key);
        const bodyHost = el.querySelector('.subsession-body');
        bodyHost.innerHTML = '';
        bodyHost.appendChild(buildSubSessionBody(key));
        bodyHost.scrollTop = 0;
        el.classList.add('open');
        el.querySelector('.subsession-panel').focus();
      }

      function openSubSession(key) {
        if (!subSessions || !subSessions[key]) return;
        if (overlayStack.length === 0) subOverlayLastFocus = document.activeElement;
        overlayStack.push(key);
        renderSubOverlay();
      }

      function popSubSession() {
        if (overlayStack.length === 0) return;
        overlayStack.pop();
        if (overlayStack.length === 0) hideSubOverlay(); else renderSubOverlay();
      }

      function popSubSessionTo(key) {
        const segments = key.split('/');
        overlayStack.length = 0;
        for (let i = 1; i <= segments.length; i++) overlayStack.push(segments.slice(0, i).join('/'));
        renderSubOverlay();
      }

      function closeAllSubSessions() {
        if (overlayStack.length === 0) return;
        overlayStack.length = 0;
        hideSubOverlay();
      }

      function hideSubOverlay() {
        if (subOverlayEl) {
          subOverlayEl.classList.remove('open');
          subOverlayEl.querySelector('.subsession-body').innerHTML = '';
        }
        if (subOverlayLastFocus && typeof subOverlayLastFocus.focus === 'function') subOverlayLastFocus.focus();
        subOverlayLastFocus = null;
      }

      // ============================================================
      // SHARE LINKS
      // ============================================================
      function buildShareUrl(entryId) {
        const baseUrlMeta = document.querySelector('meta[name="pi-share-base-url"]');
        const baseUrl = baseUrlMeta ? baseUrlMeta.content : window.location.href.split('?')[0];
        const url = new URL(window.location.href);
        const gistId = Array.from(url.searchParams.keys()).find(k => !url.searchParams.get(k));
        const params = new URLSearchParams();
        params.set('leafId', currentLeafId);
        params.set('targetId', entryId);
        if (baseUrlMeta) return baseUrl + '&' + params.toString();
        url.search = gistId ? '?' + gistId + '&' + params.toString() : '?' + params.toString();
        return url.toString();
      }

      async function copyToClipboard(text, button) {
        let success = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            success = true;
          }
        } catch {}
        if (!success) {
          try {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            success = document.execCommand('copy');
            document.body.removeChild(textarea);
          } catch {}
        }
        if (success && button) {
          button.classList.add('copied');
          button.setAttribute('title', 'Link copied');
          setTimeout(() => { button.classList.remove('copied'); button.setAttribute('title', 'Copy a link to this entry'); }, 1500);
        }
      }

      // ============================================================
      // DELEGATED CLICKS
      // ============================================================
      document.addEventListener('click', (e) => {
        const t = e.target;
        if (!(t instanceof Element)) return;

        const ply = t.closest('.ply-btn');
        if (ply) { openView(ply.dataset.view); return; }

        const think = t.closest('.thinking-toggle');
        if (think) {
          const box = think.closest('.thinking');
          const open = !box.classList.contains('is-open');
          box.classList.toggle('is-open', open);
          think.setAttribute('aria-expanded', String(open));
          return;
        }

        const copy = t.closest('.copy-link-btn');
        if (copy) { e.stopPropagation(); copyToClipboard(buildShareUrl(copy.dataset.entryId), copy); return; }

        const img = t.closest('.message-image');
        if (img) {
          const modal = document.getElementById('image-modal');
          let big = modal.querySelector('img');
          if (!big) { big = document.createElement('img'); big.alt = 'Enlarged image'; modal.appendChild(big); }
          big.src = img.src;
          modal.classList.add('open');
          return;
        }
        if (t.closest('#image-modal')) { document.getElementById('image-modal').classList.remove('open'); return; }

        const more = t.closest('.mv-more');
        if (more) {
          const list = more.closest('.mv-plies');
          const open = !list.classList.contains('is-all');
          list.classList.toggle('is-all', open);
          more.setAttribute('aria-expanded', String(open));
          more.textContent = open ? 'Fewer' : (list.querySelectorAll('.mv-ply-extra').length + ' more');
          return;
        }
        const mvPly = t.closest('.mv-ply');
        if (mvPly) { goToEntry(mvPly.dataset.entryId, mvPly.dataset.view); return; }
        const mvRow = t.closest('.mv-head, .mv-reply, .mv-note');
        if (mvRow) {
          if (mvRow.dataset.entryId) goToEntry(mvRow.dataset.entryId);
          else {
            const variation = mvRow.closest('.variation');
            if (variation) navigateTo(variation.dataset.leafId, 'target');
          }
          return;
        }
      });

      // ============================================================
      // SEARCH AND FILTERS
      // ============================================================
      const searchInput = document.getElementById('tree-search');
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderPanel();
      });
      searchInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const m = searchInput.value.trim().match(/^(\d+)(?:\.(\d+))?$/);
        if (!m) return;
        e.preventDefault();
        if (goToMove(Number(m[1]), m[2] ? Number(m[2]) : null) && isMobileLayout()) closeSidebar();
      });

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          filterMode = btn.dataset.filter;
          renderPanel();
        });
      });

      // ============================================================
      // SIDEBAR: width, mobile drawer
      // ============================================================
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      const hamburger = document.getElementById('hamburger');
      const sidebarResizer = document.getElementById('sidebar-resizer');
      const SIDEBAR_WIDTH_STORAGE_KEY = 'omp-export:v2:sidebar-width';
      const MIN_CONTENT_WIDTH = 480;

      function isMobileLayout() {
        return window.matchMedia('(max-width: 900px)').matches;
      }

      function getSidebarBounds() {
        const rootStyles = getComputedStyle(document.documentElement);
        const minWidth = parseFloat(rootStyles.getPropertyValue('--sidebar-min-width')) || 240;
        const maxWidth = parseFloat(rootStyles.getPropertyValue('--sidebar-max-width')) || 720;
        return { minWidth, maxWidth: Math.max(minWidth, Math.min(maxWidth, window.innerWidth - MIN_CONTENT_WIDTH)) };
      }

      function clampSidebarWidth(width) {
        const { minWidth, maxWidth } = getSidebarBounds();
        return Math.max(minWidth, Math.min(maxWidth, width));
      }

      function applySidebarWidth(width) {
        document.documentElement.style.setProperty('--sidebar-width', Math.round(clampSidebarWidth(width)) + 'px');
      }

      function loadSidebarWidth() {
        try {
          const raw = localStorage.getItem(SIDEBAR_WIDTH_STORAGE_KEY);
          if (raw === null) return null;
          const width = Number(raw);
          return Number.isFinite(width) ? width : null;
        } catch { return null; }
      }

      function saveSidebarWidth(width) {
        try { localStorage.setItem(SIDEBAR_WIDTH_STORAGE_KEY, String(Math.round(clampSidebarWidth(width)))); } catch {}
      }

      function setupSidebarResize() {
        const savedWidth = loadSidebarWidth();
        if (savedWidth !== null) applySidebarWidth(savedWidth);
        if (!sidebarResizer) return;
        let cleanupDrag = null;
        const stopDrag = (pointerId) => { if (cleanupDrag) { cleanupDrag(pointerId); cleanupDrag = null; } };
        sidebarResizer.addEventListener('pointerdown', (e) => {
          if (isMobileLayout()) return;
          e.preventDefault();
          const startX = e.clientX;
          const startWidth = sidebar.getBoundingClientRect().width;
          document.body.classList.add('sidebar-resizing');
          sidebarResizer.setPointerCapture?.(e.pointerId);
          const onPointerMove = (event) => applySidebarWidth(startWidth + (event.clientX - startX));
          cleanupDrag = (pointerIdToRelease) => {
            document.body.classList.remove('sidebar-resizing');
            sidebarResizer.releasePointerCapture?.(pointerIdToRelease);
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
            window.removeEventListener('pointercancel', onPointerCancel);
            saveSidebarWidth(sidebar.getBoundingClientRect().width);
          };
          const onPointerUp = (event) => stopDrag(event.pointerId);
          const onPointerCancel = (event) => stopDrag(event.pointerId);
          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
          window.addEventListener('pointercancel', onPointerCancel);
        });
        sidebarResizer.addEventListener('dblclick', () => {
          if (isMobileLayout()) return;
          applySidebarWidth(320);
          saveSidebarWidth(320);
        });
        window.addEventListener('resize', () => {
          if (isMobileLayout()) return;
          applySidebarWidth(sidebar.getBoundingClientRect().width);
        });
      }
      setupSidebarResize();

      hamburger.addEventListener('click', () => {
        sidebar.classList.add('open');
        overlay.classList.add('open');
        hamburger.setAttribute('aria-expanded', 'true');
      });
      function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
      }
      overlay.addEventListener('click', closeSidebar);
      document.getElementById('sidebar-close').addEventListener('click', closeSidebar);

      // ============================================================
      // KEYBOARD
      // ============================================================
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (overlayStack.length > 0) { e.preventDefault(); popSubSession(); return; }
          if (document.getElementById('image-modal').classList.contains('open')) { document.getElementById('image-modal').classList.remove('open'); return; }
          if (isMobileLayout() && sidebar.classList.contains('open')) { closeSidebar(); return; }
          searchInput.value = '';
          searchQuery = '';
          navigateTo(leafId, 'bottom');
          return;
        }
        const t = e.target;
        const editable = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
        if (editable) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (overlayStack.length > 0) return;
        if (e.key === 't' || e.key === 'T') { e.preventDefault(); toggleThinking(); return; }
        if (e.key === 'o' || e.key === 'O') { e.preventDefault(); toggleToolViews(); return; }
        if (e.key === 'ArrowRight' || e.key === 'j') { e.preventDefault(); stepMove(1); return; }
        if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); stepMove(-1); return; }
        if (e.key === '/') { e.preventDefault(); searchInput.focus(); searchInput.select(); return; }
      });

      // ============================================================
      // FIRST RENDER
      // ============================================================
      if (leafId) {
        if (urlTargetId && byId.has(urlTargetId)) navigateTo(leafId, 'target', urlTargetId);
        else navigateTo(leafId, 'none');
      } else if (entries.length > 0) {
        navigateTo(entries[entries.length - 1].id, 'none');
      }
      } // end bootSession

      function showLoadError(err) {
        const messages = document.getElementById('messages');
        if (!messages) return;
        const div = document.createElement('div');
        div.className = 'share-load-error';
        div.textContent = 'Failed to load the session: ' + (err && err.message ? err.message : String(err));
        messages.appendChild(div);
      }

      const pending = window.__OMP_SESSION_DATA__;
      if (pending && typeof pending.then === 'function') {
        pending.then(bootSession, showLoadError);
      } else {
        try {
          const base64 = document.getElementById('session-data').textContent;
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          bootSession(JSON.parse(new TextDecoder('utf-8').decode(bytes)));
        } catch (err) {
          showLoadError(err);
        }
      }
    })();
</script>
</body>
</html>
