<body>
  <button id="hamburger" class="moves-toggle" type="button" aria-label="Open the move list">Moves</button>
  <div id="sidebar-overlay"></div>
  <div id="app">
    <aside id="sidebar" class="study" aria-label="Move list">
      <div class="study-tools">
        <input type="search" class="study-search" id="tree-search" placeholder="Search, or a move number" autocomplete="off" spellcheck="false" aria-label="Search moves, or type a move number and press Enter">
        <select class="study-theme" id="theme-select" title="Color theme" aria-label="Color theme">
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <button class="study-close" id="sidebar-close" type="button" title="Close" aria-label="Close the move list">Close</button>
      </div>
      <div class="study-filters" role="tablist" aria-label="Move list filter">
        <button class="filter-btn active" role="tab" data-filter="default" title="Moves, conclusions, and tool lines">Default</button>
        <button class="filter-btn" role="tab" data-filter="no-tools" title="Moves and commentary, no tool lines">No tools</button>
        <button class="filter-btn" role="tab" data-filter="user-only" title="Only your prompts">Prompts</button>
        <button class="filter-btn" role="tab" data-filter="labeled-only" title="Only labeled entries">Labeled</button>
        <button class="filter-btn" role="tab" data-filter="all" title="Everything, including settings changes">All</button>
      </div>
      <div class="study-list" id="tree-container"></div>
      <div class="study-status" id="tree-status"></div>
    </aside>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize the move list"></div>
    <main id="content">
      <div id="header-container"></div>
      <div id="messages" class="game-text"></div>
    </main>
    <div id="image-modal" class="image-modal" role="dialog" aria-label="Enlarged image"></div>
  </div>

  <script>    (() => {
      // ============================================================
      // THEME
      // ============================================================
      const THEME_STORAGE_KEY = 'omp-export-theme';
      const themeSelect = document.getElementById('theme-select');

      function applyThemePreference(next) {
        if (next === 'light' || next === 'dark') {
          document.documentElement.dataset.theme = next;
        } else {
          delete document.documentElement.dataset.theme;
        }
        try {
          if (next === 'light' || next === 'dark') localStorage.setItem(THEME_STORAGE_KEY, next);
          else localStorage.removeItem(THEME_STORAGE_KEY);
        } catch {}
      }

      try {
        const stored = localStorage.getItem(THEME_STORAGE_KEY);
        if (themeSelect) themeSelect.value = stored === 'light' || stored === 'dark' ? stored : 'auto';
      } catch {}
      if (themeSelect) themeSelect.addEventListener('change', (e) => applyThemePreference(e.target.value));

      // ============================================================
      // BOOT
      // ============================================================
      //
      // Two boot paths share this template:
      //  - Static export: session JSON rides base64-embedded in #session-data.
      //  - Share viewer: share-loader.js sets `window.__OMP_SESSION_DATA__` to
      //    a promise resolving to the session JSON (fetched + decrypted).
      function bootSession(data) {
      const { header, entries, leafId: defaultLeafId, systemPrompt, tools, subSessions } = data;

      const mainSctx = { entries, prefix: '', idPrefix: 'entry-' };

      // ============================================================
      // URL PARAMETERS (deep links: leafId, targetId)
      // ============================================================
      const injectedParams = document.querySelector('meta[name="pi-url-params"]');
      const searchString = injectedParams ? injectedParams.content : window.location.search.substring(1);
      const urlParams = new URLSearchParams(searchString);
      const urlLeafId = urlParams.get('leafId');
      const urlTargetId = urlParams.get('targetId');
      const leafId = urlLeafId || defaultLeafId;

      // ============================================================
      // DATA STRUCTURES
      // ============================================================
      const byId = new Map();
      for (const entry of entries) byId.set(entry.id, entry);

      const labelMap = new Map();
      for (const entry of entries) {
        if (entry.type === 'label' && entry.targetId && entry.label) labelMap.set(entry.targetId, entry.label);
      }

      // Tool results by tool call id, per entry list (main session and each sub-session).
      const resultMapCache = new WeakMap();
      function resultMapFor(entryList) {
        let map = resultMapCache.get(entryList);
        if (!map) {
          map = new Map();
          for (const entry of entryList) {
            if (entry.type === 'message' && entry.message.role === 'toolResult') map.set(entry.message.toolCallId, entry.message);
          }
          resultMapCache.set(entryList, map);
        }
        return map;
      }

      function buildTree() {
        const nodeMap = new Map();
        const roots = [];
        for (const entry of entries) nodeMap.set(entry.id, { entry, children: [], label: labelMap.get(entry.id) });
        for (const entry of entries) {
          const node = nodeMap.get(entry.id);
          if (entry.parentId === null || entry.parentId === undefined || entry.parentId === entry.id) {
            roots.push(node);
          } else {
            const parent = nodeMap.get(entry.parentId);
            if (parent) parent.children.push(node); else roots.push(node);
          }
        }
        const sortStack = [...roots];
        while (sortStack.length > 0) {
          const node = sortStack.pop();
          node.children.sort((a, b) => new Date(a.entry.timestamp).getTime() - new Date(b.entry.timestamp).getTime());
          for (let i = node.children.length - 1; i >= 0; i--) sortStack.push(node.children[i]);
        }
        return { roots, nodeMap };
      }
      const { roots: treeRoots, nodeMap: treeNodes } = buildTree();

      function buildActivePathIds(targetId) {
        const ids = new Set();
        let current = byId.get(targetId);
        while (current) {
          ids.add(current.id);
          if (!current.parentId || current.parentId === current.id) break;
          current = byId.get(current.parentId);
        }
        return ids;
      }

      function getPath(targetId) {
        const path = [];
        let current = byId.get(targetId);
        while (current) {
          path.unshift(current);
          if (!current.parentId || current.parentId === current.id) break;
          current = byId.get(current.parentId);
        }
        return path;
      }

      // Deepest entry below a node: the active branch when it holds the leaf,
      // otherwise the most recent child at every fork.
      function leafOf(node, activeIds) {
        let current = node;
        while (current.children.length > 0) {
          const active = current.children.find(c => subtreeHasActive(c, activeIds));
          current = active || current.children[current.children.length - 1];
        }
        return current.entry.id;
      }

      const activeCache = new Map();
      function subtreeHasActive(node, activeIds) {
        const key = node.entry.id;
        if (activeCache.has(key)) return activeCache.get(key);
        // Iterative post-order so deep chains do not exhaust the stack.
        const order = [];
        const stack = [node];
        while (stack.length) {
          const n = stack.pop();
          order.push(n);
          for (const c of n.children) stack.push(c);
        }
        for (let i = order.length - 1; i >= 0; i--) {
          const n = order[i];
          let has = activeIds.has(n.entry.id);
          for (const c of n.children) if (activeCache.get(c.entry.id)) has = true;
          activeCache.set(n.entry.id, has);
        }
        return activeCache.get(key);
      }

      // ============================================================
      // TEXT HELPERS
      // ============================================================
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
      }

      function canonicalizeMessage(text) {
        if (!text) return '';
        const trimmed = text.trim();
        for (let i = 0; i < trimmed.length; i++) {
          const code = trimmed.charCodeAt(i);
          if (code !== 0x2e && code !== 0x2026 && code !== 0x20 && code !== 0x09 && code !== 0x0a && code !== 0x0d) return trimmed;
        }
        return '';
      }

      function extractContent(content) {
        if (typeof content === 'string') return content;
        if (Array.isArray(content)) return content.filter(c => c.type === 'text' && c.text).map(c => c.text).join('');
        return '';
      }

      function hasTextContent(content) {
        return Boolean(canonicalizeMessage(extractContent(content)));
      }

      function firstLine(text, maxLen = 110) {
        const s = (text || '').replace(/\s+/g, ' ').trim();
        if (s.length <= maxLen) return s;
        const cut = s.slice(0, maxLen);
        const sp = cut.lastIndexOf(' ');
        return (sp > 40 ? cut.slice(0, sp) : cut) + '…';
      }

      function shortenPath(p) {
        if (typeof p !== 'string') return '';
        if (p.startsWith('/Users/') || p.startsWith('/home/')) {
          const parts = p.split('/');
          if (parts.length > 2) return '~' + p.slice(('/' + parts[1] + '/' + parts[2]).length);
        }
        return p;
      }

      function formatTokens(count) {
        if (count < 1000) return String(count);
        if (count < 10000) return (count / 1000).toFixed(1) + 'k';
        if (count < 1000000) return Math.round(count / 1000) + 'k';
        return (count / 1000000).toFixed(1) + 'M';
      }

      function formatClock(ts) {
        if (!ts) return '';
        return new Date(ts).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
      }

      function formatLongDate(ts) {
        if (!ts) return 'unknown date';
        return new Date(ts).toLocaleString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
      }

      function replaceTabs(text) {
        return text.replace(/\t/g, '   ');
      }

      function resultSize(result) {
        if (!result) return { chars: 0, lines: 0 };
        let chars = 0;
        let lines = 0;
        const content = result.content;
        if (typeof content === 'string') {
          chars = content.length;
          lines = content ? content.split('\n').length : 0;
        } else if (Array.isArray(content)) {
          for (const part of content) {
            if (part && part.type === 'text' && typeof part.text === 'string') {
              chars += part.text.length;
              lines += part.text ? part.text.split('\n').length : 0;
            } else if (part && part.type === 'image') {
              chars += 2000;
              lines += 1;
            }
          }
        }
        return { chars, lines };
      }

      function sizeLabel(size) {
        if (!size.chars) return '';
        if (size.lines > 1) return size.lines.toLocaleString() + ' lines';
        return size.chars.toLocaleString() + ' chars';
      }

      // Bar width as a fraction: 10 chars -> 0, 100k chars -> 1.
      function sizeFraction(size) {
        if (!size.chars) return 0;
        return Math.max(0, Math.min(1, (Math.log10(size.chars + 1) - 1) / 4));
      }

      const KIND_BY_TOOL = {
        read: 'read', ls: 'read', glob: 'read', find: 'read', grep: 'read', search: 'read', fetch: 'read', web: 'read', lsp: 'read',
        write: 'write', edit: 'edit', patch: 'edit',
        bash: 'run', eval: 'run', exec: 'run', python: 'run',
        task: 'task', agent: 'task', todo: 'plan', plan: 'plan',
      };
      function toolKind(name) {
        return KIND_BY_TOOL[name] || 'other';
      }
      function isDiagramTool(name) {
        const kind = toolKind(name);
        return kind === 'write' || kind === 'edit';
      }

      function argPath(args) {
        return shortenPath(String(args.path || args.file_path || args.filePath || ''));
      }

      function toolTarget(name, args) {
        args = args || {};
        switch (name) {
          case 'read': {
            let display = argPath(args);
            if (args.offset !== undefined || args.limit !== undefined) {
              const start = args.offset ?? 1;
              const end = args.limit !== undefined ? start + args.limit - 1 : '';
              display += ':' + start + (end ? '–' + end : '');
            }
            return display;
          }
          case 'write':
          case 'edit':
          case 'patch':
            return argPath(args);
          case 'bash':
          case 'exec': {
            const raw = String(args.command || args.cmd || '');
            return firstLine(raw, 72);
          }
          case 'grep':
          case 'search': {
            const paths = args.paths || [args.path || '.'];
            return '/' + (args.pattern || '') + '/ in ' + shortenPath(String([].concat(paths).join(', ')));
          }
          case 'glob':
          case 'find':
            return shortenPath(String([].concat(args.paths || [args.pattern || '.']).join(', ')));
          case 'ls':
            return shortenPath(String(args.path || '.'));
          case 'eval': {
            const lang = args.language || args.lang || '';
            const code = String(args.code || args.input || '');
            return (lang ? lang + ' · ' : '') + firstLine(code, 60);
          }
          case 'task':
          case 'agent':
            return firstLine(String(args.description || args.prompt || args.agent || ''), 72);
          case 'todo':
            return firstLine(String(args.op || args.action || 'update'), 40);
          default: {
            const s = JSON.stringify(args);
            return firstLine(s, 60);
          }
        }
      }

      function isPromptEntry(entry) {
        return entry.type === 'message' && (entry.message.role === 'user' || entry.message.role === 'developer');
      }

      const SETTINGS_TYPES = new Set(['label', 'custom', 'model_change', 'thinking_level_change', 'mode_change', 'ttsr_injection', 'session_init', 'credential_pin', 'service_tier_change', 'title_change']);

      // ============================================================
      // MARKDOWN
      // ============================================================
      function escapeHtmlTags(text) {
        return text.replace(/<(?=[a-zA-Z\/])/g, '&lt;');
      }

      const hasMarked = typeof marked !== 'undefined' && marked && typeof marked.parse === 'function';
      const hasHljs = typeof hljs !== 'undefined' && hljs && typeof hljs.highlight === 'function';

      function highlightCode(code, lang) {
        if (hasHljs) {
          try {
            if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
            return hljs.highlightAuto(code).value;
          } catch {}
        }
        return escapeHtml(code);
      }

      if (hasMarked) {
        marked.use({
          breaks: true,
          gfm: true,
          renderer: {
            code(token) {
              return '<pre><code class="hljs">' + highlightCode(token.text, token.lang) + '</code></pre>';
            },
            text(token) {
              if (token.tokens) return this.parser.parseInline(token.tokens);
              return token.escaped ? token.text : escapeHtmlTags(escapeHtml(token.text));
            },
            codespan(token) {
              return '<code>' + escapeHtml(token.text) + '</code>';
            },
          },
        });
      }

      function safeMarkedParse(text) {
        if (hasMarked) {
          try { return marked.parse(text); } catch {}
        }
        return '<pre class="plain">' + escapeHtml(text) + '</pre>';
      }

      // ============================================================
      // TOOL VIEWS
      // ============================================================
      //
      // Tool calls render through the bundled <omp-tool-view> web component
      // (tool-views.generated.js). Payloads are handed over via a global
      // store keyed by data-key, which survives innerHTML serialization.
      const TOOL_VIEW_DATA = new Map();
      globalThis.__OMP_TOOL_VIEW_DATA = TOOL_VIEW_DATA;
      let toolViewSeq = 0;

      function toolViewHtml(call, result, sctx, blockId) {
        const statusClass = result ? (result.isError ? 'error' : 'success') : 'pending';
        const key = 'tv' + (++toolViewSeq);
        TOOL_VIEW_DATA.set(key, {
          name: call.name,
          args: call.arguments || {},
          result: result || undefined,
          host: {
            hasAgent: (id) => !!lookupSubSession(sctx.prefix, id),
            openAgent: (id) => openSubSession(joinKey(sctx.prefix, id)),

        });
        return '<omp-tool-view class="tool-execution ' + statusClass + '" id="' + blockId + '" data-key="' + key + '" open></omp-tool-view>';
      }

      // ============================================================
      // MOVES: group a root-to-leaf path into numbered moves
      // ============================================================
      //
      // A move starts at each prompt (user or developer message). Everything
      // until the next prompt belongs to it: replies (assistant messages),
      // tool results (attached to their calls as plies), and events.
      function buildMoves(path, sctx) {
        const results = resultMapFor(sctx.entries);
        const moves = [];
        let current = null;
        let moveNo = 0;

        const ensurePre = () => {
          if (!current) {
            current = { no: 0, entry: null, items: [], plies: [] };
            moves.push(current);
          }
        };

        for (const entry of path) {
          if (isPromptEntry(entry)) {
            moveNo++;
            current = { no: moveNo, entry, items: [], plies: [] };
            moves.push(current);
            continue;
          }
          if (entry.type === 'message' && entry.message.role === 'toolResult') continue;
          if (entry.type === 'custom' || entry.type === 'label') continue;
